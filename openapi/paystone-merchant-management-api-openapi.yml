          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Error.jsonld'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized — missing or invalid JWT token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: JWT Token not found
      summary: Retrieve a merchant by external reference.
      description: Retrieves a Merchant resource.
      parameters:
      - name: accessKey
        in: path
        description: Unique access key identifying the client.
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
        example: abc123def456
      - name: externalReference
        in: path
        description: Merchant external reference ID.
        required: true
        deprecated: false
        schema:
          type: string
        style: simple
        explode: false
        example: EXT-001
      security:
      - JWT: {}
    patch:
      operationId: api_v1clients_accessKeymerchantsby-external-reference_externalReference_patch
      tags:
      - Merchant Management
      responses:
        200:
          description: Merchant updated successfully.
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Merchant.jsonld-merchant.read'
        400:
          description: Invalid input
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Error.jsonld'
            application/problem+json:
              schema:
