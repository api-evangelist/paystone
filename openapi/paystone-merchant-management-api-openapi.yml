components:
  schemas:
    Merchant.jsonld-merchant.read_merchant.read.item:
      allOf:
      - $ref: '#/components/schemas/HydraItemBaseSchema'
      - type: object
        properties:
          name:
            description: Name of the merchant
            type:
            - string
            - 'null'
          storeNumber:
            description: Unique store number within the client
            type:
            - string
            - 'null'
          type:
            description: Merchant type (point_of_sale, head_office, e-commerce, web_pos, third_party, other)
            type:
            - string
            - 'null'
          isActive:
            description: Merchant status (active, inactive)
            type:
            - boolean
            - 'null'
          language:
            description: Language code (en or fr)
            type:
            - string
            - 'null'
          timezone:
            description: Timezone (e.g., America/Toronto)
            type:
            - string
            - 'null'
          email:
            description: Email address
            type:
            - string
            - 'null'
          phoneNumber:
            description: Phone number
            type:
            - string
            - 'null'
          faxNumber:
            description: Fax number
            type:
            - string
            - 'null'
          contactName:
            description: Contact name
            type:
            - string
            - 'null'
          externalReference:
            description: External reference ID
            type:
            - string
            - 'null'
          address:
            anyOf:
            - $ref: '#/components/schemas/Address.jsonld-merchant.read_merchant.read.item'
            - type: 'null'
          parent:
            description: Parent merchant ID
            type:
            - integer
            - 'null'
          latitude:
            description: Latitude coordinate (-90 to 90)
            type:
            - number
            - 'null'
          longitude:
            description: Longitude coordinate (-180 to 180)
            type:
            - number
            - 'null'
          creationDate:
            type:
            - string
            - 'null'
            format: date-time
          modificationDate:
            type:
            - string
            - 'null'
            format: date-time
          coordinates:
            anyOf:
            - $ref: '#/components/schemas/Point.jsonld-merchant.read_merchant.read.item'
            - type: 'null'
            readOnly: true
    Error:
      type: object
      description: A representation of common errors.
      properties:
        title:
          readOnly: true
          description: A short, human-readable summary of the problem.
          type:
          - string
          - 'null'
        detail:
          readOnly: true
          description: A human-readable explanation specific to this occurrence of the problem.
          type:
          - string
          - 'null'
        status:
          type:
          - number
          - 'null'
          examples:
          - 404
          default: 400
        instance:
          readOnly: true
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
          type:
          - string
          - 'null'
        type:
          readOnly: true
          description: A URI reference that identifies the problem type
          type: string
    ConstraintViolation.jsonld:
      allOf:
      - $ref: '#/components/schemas/HydraItemBaseSchema'
      - type: object
        properties:
          status:
            default: 422
            type: integer
          violations:
            type: array
            items:
              type: object
              properties:
                propertyPath:
                  type: string
                  description: The property path of the violation
                message:
                  type: string
                  description: The message associated with the violation
                code:
                  type: string
                  description: The code of the violation
                hint:
                  type: string
                  description: An extra hint to understand the violation
                payload:
                  type: object
                  additionalProperties: true
                  description: The serialized payload of the violation
              required:
              - propertyPath
              - message
          detail:
            readOnly: true
            type: string
          description:
            readOnly: true
            type: string
          type:
            readOnly: true
            type: string
          title:
            readOnly: true
            type:
            - string
            - 'null'
          instance:
            readOnly: true
            type:
            - string
            - 'null'
      description: Unprocessable entity
    Merchant.jsonld-merchant.write:
      allOf:
      - $ref: '#/components/schemas/HydraItemBaseSchema'
      - type: object
        required:
        - name
        - storeNumber
        - type
        - language
        - timezone
        - password
        properties:
          name:
            maxLength: 128
            description: Name of the merchant
            type:
            - string
            - 'null'
          storeNumber:
            maxLength: 20
            description: Unique store number within the client
            type:
            - string
            - 'null'
          type:
            enum:
            - point_of_sale
            - head_office
            - e-commerce
            - web_pos
            - third_party
            - other
            description: Merchant type (point_of_sale, head_office, e-commerce, web_pos, third_party, other)
            type:
            - string
            - 'null'
          language:
            enum:
            - en
            - fr
            description: Language code (en or fr)
            type:
            - string
            - 'null'
          timezone:
            maxLength: 30
            description: Timezone (e.g., America/Toronto)
            type:
            - string
            - 'null'
          password:
            pattern: ^([1-9]{8})$
            writeOnly: true
            description: Merchant password (8 digits, 1-9 only)
            type:
            - string
            - 'null'
          email:
            format: email
            maxLength: 45
            description: Email address
            externalDocs:
              url: https://schema.org/email
            type:
            - string
            - 'null'
          phoneNumber:
            maxLength: 40
            description: Phone number
            type:
            - string
            - 'null'
          faxNumber:
            maxLength: 30
            description: Fax number
            type:
            - string
            - 'null'
          contactName:
            maxLength: 255
            description: Contact name
            type:
            - string
            - 'null'
          externalReference:
            maxLength: 20
            description: External reference ID
            type:
            - string
            - 'null'
          address:
            anyOf:
            - $ref: '#/components/schemas/Address.jsonld-merchant.write'
            - type: 'null'
          parent:
            description: Parent merchant ID
            type:
            - integer
            - 'null'
          latitude:
            minimum: -90
            maximum: 90
            description: Latitude coordinate (-90 to 90)
            type:
            - number
            - 'null'
          longitude:
            minimum: -180
            maximum: 180
            description: Longitude coordinate (-180 to 180)
            type:
            - number
            - 'null'
          terminalInitializationCode:
            readOnly: true
            description: Terminal initialization code
            type:
            - string
            - 'null'
