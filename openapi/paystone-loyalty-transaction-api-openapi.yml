openapi: 3.2.0
info:
  title: DataCandy Loyalty Transaction API
  description: 'REST API for the DataCandy platform. Provides endpoints for managing merchants,

    clients, contacts, account types, transactions, webhooks, and portal configuration.


    All endpoints require a JWT bearer token unless stated otherwise.'
  version: 26.7.1.0-d9107e6
servers:
- url: /
  description: ''
security:
- JWT: {}
tags:
- name: Loyalty Transaction
paths:
  /loyalty-transactions:
    get:
      operationId: api_loyalty-transactions_get_collection
      tags:
      - Loyalty Transaction
      responses:
        200:
          description: List of loyalty transactions.
          content:
            application/ld+json:
              schema:
                type: object
                description: LoyaltyTransaction.jsonld-transaction.read collection.
                allOf:
                - $ref: '#/components/schemas/HydraCollectionBaseSchema'
                - type: object
                  required:
                  - hydra:member
                  properties:
                    hydra:member:
                      type: array
                      items:
                        $ref: '#/components/schemas/LoyaltyTransaction.jsonld-transaction.read'
        403:
          description: Forbidden — token does not have the required role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 403
                  message:
                    type: string
                    example: Access Denied.
        401:
          description: Unauthorized — missing or invalid JWT token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: JWT Token not found
      summary: Retrieve all loyalty transactions.
      description: Retrieves the collection of LoyaltyTransaction resources.
      parameters:
      - name: page
        in: query
        description: The collection page number
        required: false
        deprecated: false
        schema:
          type: integer
          default: 1
        style: form
        explode: false
      - name: itemsPerPage
        in: query
        description: The number of items per page
        required: false
        deprecated: false
        schema:
          type: integer
          default: 30
          minimum: 0
          maximum: 30
        style: form
        explode: false
      - name: creationDate[before]
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: creationDate[strictly_before]
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: creationDate[after]
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: creationDate[strictly_after]
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: merchant
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: string
        style: form
        explode: false
      - name: merchant[]
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      - name: errorCode
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: integer
        style: form
        explode: false
      - name: errorCode[]
        in: query
        description: ''
        required: false
        deprecated: false
        schema:
          type: array
          items:
            type: integer
        style: form
        explode: true
      - name: commitStatus
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - committed
          - not_committed
        style: form
        explode: false
        allowReserved: false
      - name: operation
        in: query
        description: ''
        required: false
        deprecated: false
        allowEmptyValue: true
        schema:
          type: string
          enum:
          - accumulation
          - activation
          - add
          - associate_profile
          - balance
          - balance_import
          - balance_transfer
          - cancel_discount_per_unit_redemption
          - card_detail_info
          - card_empty
          - card_info
          - commit
          - complete_cancel
          - create_profile
          - credit_note_activation
          - credit_note_increment
          - daily_details_employee
          - daily_summary_employee
          - daily_summary_merchant
          - discount_per_unit_balance
          - discount_per_unit_lock
          - discount_per_unit_redeem
          - discount_per_unit_unlock
          - discount_promotion_available
          - get_association
          - increment
          - item_cancel
          - lock
          - lock_modification
          - merchant_info
          - non_member_acc_info
          - partial_cancel
          - pil_enrollment
          - pil_payment
          - point_expiry
          - profile_info
          - profile_set_association
          - punch_add
          - punch_remove
          - redeem
          - redeem_unlock
          - reward_add
          - reward_detail_info
          - reward_earned
          - reward_expired
          - reward_redeem
          - reward_remove
          - subtract
        style: form
        explode: false
        allowReserved: false
      security:
      - JWT: {}
  /loyalty-transactions/{id}:
    get:
      operationId: api_loyalty-transactions_id_get
      tags:
      - Loyalty Transaction
      responses:
        200:
          description: Loyalty transaction retrieved successfully.
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/LoyaltyTransaction.jsonld-transaction.read_transaction.read.item'
        403:
          description: Forbidden — token does not have the required role.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 403
                  message:
                    type: string
                    example: Access Denied.
        404:
          description: Not found — the requested resource does not exist.
          content:
            application/ld+json:
              schema:
                $ref: '#/components/schemas/Error.jsonld'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        401:
          description: Unauthorized — missing or invalid JWT token.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: JWT Token not found
      summary: Retrieve a loyalty transaction by ID.
      description: Retrieves a LoyaltyTransaction resource.
      parameters:
      - name: id
        in: path
        description: Numeric transaction ID.
        required: true
        deprecated: false
        schema:
          type: integer
        style: simple
        explode: false
        example: 123
      security:
      - JWT: {}
