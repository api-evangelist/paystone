apis:
- aid: paystone:paystone-datacandy-api
  name: Paystone DataCandy API
  description: >-
    The public, documented REST API for Paystone's DataCandy gift-card and
    loyalty platform, built on API Platform (Hydra/JSON-LD) and served from
    api.paystone.com. It exposes 28 documented paths across 14 resource groups
    — client and merchant management, contacts, gift/loyalty/prepaid/promo
    account types, loyalty and prepaid transactions, rewards and items, member
    and balance portals, user management, and webhook management. All endpoints
    require a JWT bearer token. An interactive Swagger UI is published at
    api.paystone.com/docs and a machine-readable OpenAPI 3.1 export is
    downloadable from the same host.
  humanURL: https://api.paystone.com/docs
  baseURL: https://api.paystone.com
