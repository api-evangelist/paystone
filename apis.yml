name: Paystone
kind: company
description: >-
  Paystone is a Canadian payment processing and customer-engagement company
  headquartered in London, Ontario, positioning itself as one of the country's
  largest bank-independent payment processors. It sells card-present terminals,
  online checkout and hosted payment pages, virtual terminals, invoicing, and
  recurring billing to Canadian small and mid-sized businesses, and layers
  loyalty, gift-card, and reputation-marketing products on top of the payment
  rails. Paystone owns DataCandy, a long-standing Canadian gift-card and
  loyalty platform, and it is DataCandy that carries Paystone's public,
  self-serve, documented API surface: a live API Platform (Hydra/JSON-LD) REST
  API at api.paystone.com covering merchants, clients, contacts, gift/loyalty/
  prepaid/promo account types, transactions, member and balance portals, and
  webhooks, authenticated with JWT bearer tokens and documented through an
  interactive Swagger UI. Paystone's core card-acquiring and payment-gateway
  processing is delivered as a merchant product rather than a publicly
  self-serve developer API, so the honest developer story here is the DataCandy
  gift-and-loyalty platform API, not a public payments/acquiring API.
